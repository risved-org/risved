name: Release

# Two ways in:
#   * Actions -> Release -> Run workflow: tags whatever version package.json on
#     main already says and publishes it. This is the normal path.
#   * pushing a v* tag by hand (bun run release): publishes that tag as before.
#
# The version itself is bumped by an ordinary pull request, so it goes through
# CI and the merge queue like any other change. This workflow never writes to
# main: the OSS ruleset requires a pull request there, and GITHUB_TOKEN holds no
# bypass, so a bump commit from here would simply be rejected.
on:
  workflow_dispatch:
    inputs:
      expect_version:
        description: Refuse to release unless main is at this version (optional)
        type: string
        required: false
  push:
    tags:
      - 'v*'

# Deliberately no concurrency group. A group holds at most one running and one
# pending run, so a third release would silently cancel the pending one and that
# tag would never get an image. Overlapping releases are made safe instead by
# the newest-tag guard on :latest in build-and-push.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Dispatch only. On a tag push this is skipped and the jobs below fall back
  # to github.ref_name.
  prepare:
    name: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main

      - name: Resolve the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ inputs.expect_version }}
        run: |
          set -euo pipefail
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          VERSION=$(node -p "require('./package.json').version")

          # Guard against releasing whatever happens to be sitting on main.
          if [ -n "$EXPECT" ] && [ "${EXPECT#v}" != "$VERSION" ]; then
            echo "::error::main is at $VERSION, not ${EXPECT#v}"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
            echo "::error::package.json version '$VERSION' is not an x.y.z version"
            exit 1
          fi
          # Claimed server-side, so two releases started at once cannot both
          # take the tag, and a re-run cannot overwrite a published release.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released — bump package.json on main first"
            exit 1
          fi
          # And it must not go backwards past an existing release.
          NEWEST=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("^refs/tags/v"; "")' \
            | { grep -E "$SEMVER" || true; } \
            | sort -V | tail -1)
          if [ -n "$NEWEST" ] &&
             [ "$(printf '%s\n%s\n' "$NEWEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is behind the newest release v$NEWEST"
            exit 1
          fi

          # The commit actually checked out and validated. Not GITHUB_SHA: a
          # dispatch can be started from any ref, so that would be the ref the
          # run was launched from, whose package.json was never read here.
          SHA=$(git rev-parse HEAD)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from ${SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag it and open the release
        # github.token, never a PAT: a tag ref created with a PAT emits a push
        # event that would match the `v*` trigger and start a second release
        # run, publishing everything twice. GITHUB_TOKEN cannot trigger another
        # workflow, which is the invariant build-and-push relies on.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          # One call creates the tag and the release together, so a failure
          # cannot leave behind a tag that blocks the retry on the existing-tag
          # check above. Pinned to the commit that was just validated.
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$SHA"

  # A tag created with GITHUB_TOKEN does not start another workflow run, so the
  # image has to be built here in the same run rather than by the push trigger.
  build-and-push:
    name: build-and-push
    needs: prepare
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag || github.ref_name }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # install.sh defaults to :latest, so that tag must never come to point at
      # an older image than version.json advertises. Rather than serialising
      # releases — a concurrency group keeps only one pending run and would drop
      # a third — just refuse to move :latest when this is not the newest tag.
      # That also covers an old v* tag pushed by hand after a newer release.
      - name: Is this the newest release tag?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          NEWEST=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("^refs/tags/v"; "")' \
            | { grep -E "$SEMVER" || true; } \
            | sort -V | tail -1)
          # A >= test rather than equality: this tag normally already exists by
          # now (prepare created it), but the answer stays right either way.
          if [ -n "$NEWEST" ] &&
             [ "$(printf '%s\n%s\n' "$NEWEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is behind v$NEWEST, leaving :latest alone"
          else
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The semver patterns strip the leading v, so the git tag v0.18.9
          # publishes ghcr.io/risved-org/risved:0.18.9 as the self-update
          # system expects.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_newest }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The self-update check polls https://risved.com/version.json, which is a
  # static file in the risved.com repo. Pin it to this release once the image
  # is on ghcr, so dashboards offer the update without a manual PR.
  publish-version:
    name: publish-version
    needs: [prepare, build-and-push]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag || github.ref_name }}

      - name: Pin control plane version on risved.com
        env:
          GH_TOKEN: ${{ secrets.RISVED_COM_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: bash scripts/publish-version.sh
